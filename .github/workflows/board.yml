name: 实验二成绩看板
on:
  workflow_run:
    workflows: [实验二自动评分]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: lab02-grade-board
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: 读取最新PR与机器人评分并更新名单
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE_NUMBER: ${{ vars.TRACKING_ISSUE_NUMBER }}
          CLASS_ROSTER_JSON: ${{ secrets.CLASS_ROSTER_JSON }}
        run: python automation/update_board.py
      - uses: actions/upload-artifact@v4
        with:
          name: student-grades
          path: tracking/
